# version: '3.8'

services:

  app:
    build: .
    ports:
      - '9000:9000'
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/postgres?schema=public"
      REDIS_URL: "redis://redis:6379"
      S3_ENDPOINT: "http://minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    restart: unless-stopped

  minio:
    image: 'minio/minio:latest'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9002:9000'
      - '9001:9001'
    volumes:
      - chat-backend_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: 'minio/mc:latest'
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb -p local/datakontrol || true;
      "

  postgres:
    image: 'postgres:16.2'
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5469:5432'
    volumes:
      - chat-backend_postgres_data:/var/lib/postgresql/data
      # copy the sql script to create tables
      # - ./sql/create_tables_v3.sql:/docker-entrypoint-initdb.d/create_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  chat-backend_postgres_data:
  chat-backend_minio_data:
